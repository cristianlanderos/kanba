# Kanba and its database, with nothing outside this file.
#
#   cp .env.example .env    # then set POSTGRES_PASSWORD
#   docker compose up -d --build
#
# The board is then at http://localhost:3000. Sign up to make the first account.
services:
  db:
    image: postgres:16-alpine
    container_name: kanba-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kanba
      POSTGRES_USER: kanba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${KANBA_DATA:-kanba-db}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanba -d kanba"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    image: kanba:local
    container_name: kanba
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kanba:${POSTGRES_PASSWORD}@db:5432/kanba
      KANBA_ALLOW_SIGNUP: ${KANBA_ALLOW_SIGNUP:-true}
      KANBA_DEFAULT_PLAN: ${KANBA_DEFAULT_PLAN:-pro}
    ports:
      - "${KANBA_PORT:-3000}:3000"

volumes:
  kanba-db:
